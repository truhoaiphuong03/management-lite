name: Windows Release Artifact Builder (Option 1 - Hosted Only)
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-char SHA candidate for Windows release bundle
        required: true
        type: string
      ci_run_id:
        description: Successful CI run ID for that exact SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: management-lite-windows-artifact-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  build-windows-artifact:
    name: Build & Package Immutable Windows Artifact (Hosted Runner Only)
    if: github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.commit_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - name: Validate SHA & CI Run ID Format
        shell: pwsh
        run: |
          if ($env:RELEASE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "REJECTED_INVALID_SHA: commit_sha must be a 40-character lowercase hex SHA."
          }
          if ($env:CI_RUN_ID -notmatch '^[0-9]+$') {
            throw "REJECTED_INVALID_CI_RUN_ID: ci_run_id must be numeric."
          }

      - name: Checkout Candidate SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          path: candidate

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0

      - name: Build Windows Release Bundle & Provenance
        working-directory: candidate
        shell: pwsh
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:RELEASE_SHA) {
            throw "REJECTED_SHA_MISMATCH: Checked out $actualSha != $env:RELEASE_SHA"
          }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:web
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/deployment/package-release.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path release-bundle).Path, (Join-Path $PWD 'release.zip'))
          $hash = (Get-FileHash release.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Set-Content release.zip.sha256 -NoNewline

      - name: Upload Immutable Windows Release Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ inputs.commit_sha }}
          path: |
            candidate/release.zip
            candidate/release.zip.sha256
          retention-days: 30
          if-no-files-found: error
