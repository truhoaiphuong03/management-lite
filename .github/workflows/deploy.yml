name: Management Lite Release Artifact Builder (Option 1 - Hosted CI Only)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Target 40-char commit SHA to verify, build, and package into immutable release bundle'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: management-lite-release-artifact-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  ci-verify-and-package:
    name: Verify Exact SHA, Run Full CI & Package Immutable Bundle (Zero Self-Hosted Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate 40-Character Hex Commit SHA
        run: |
          if [[ ! "${{ inputs.commit_sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: commit_sha must be a 40-character lowercase hexadecimal Git SHA."
            exit 1
          fi

      - name: Checkout Exact Immutable Commit SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Checked-Out HEAD Matches Requested SHA
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "${{ inputs.commit_sha }}" ]; then
            echo "ERROR: Checked out SHA ($ACTUAL_SHA) does not match requested SHA (${{ inputs.commit_sha }})"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run Unit, Contract & Web Security Tests
        run: |
          npm test
          node --test tests/web/*.test.mjs tests/backend/cicd-policy.test.mjs

      - name: Build Backend API & Frontend Web
        run: |
          npm run build
          npm run build:web

      - name: Package Immutable Release Bundle & Independent CI Run Receipt
        run: |
          node scripts/deployment/package-release-bundle.mjs --type=full --out=.artifacts/release
          cat <<EOF > .artifacts/release/ci-run-receipt-${{ inputs.commit_sha }}.json
          {
            "id": "${{ github.run_id }}",
            "run_id": "${{ github.run_id }}",
            "head_sha": "${{ inputs.commit_sha }}",
            "status": "completed",
            "conclusion": "success",
            "event": "${{ github.event_name }}",
            "repository": "${{ github.repository }}",
            "generated_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Upload Immutable Release Artifact & CI Receipt
        uses: actions/upload-artifact@v4
        with:
          name: management-lite-release-${{ inputs.commit_sha }}
          path: |
            .artifacts/release/management-lite-full-*.tar.gz
            .artifacts/release/management-lite-full-*.tar.gz.sha256
            .artifacts/release/management-lite-full-*.tar.gz.provenance.json
            .artifacts/release/ci-run-receipt-${{ inputs.commit_sha }}.json
          retention-days: 30
          if-no-files-found: error
