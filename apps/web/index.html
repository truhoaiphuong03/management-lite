<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1220" />
    <!-- Inline icon: avoids a /favicon.ico request that would otherwise 404 on every visit. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314B8A6'/%3E%3Ctext x='16' y='22' font-size='18' font-weight='700' text-anchor='middle' fill='%230B1220' font-family='sans-serif'%3EM%3C/text%3E%3C/svg%3E"
    />
    <title>Management Lite</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mglite_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'light') {
            document.documentElement.style.colorScheme = 'light';
          } else if (t === 'dark') {
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    style="
      background-color: var(--bg-color, #0b1220);
      margin: 0;
      padding: 0;
      color: var(--text-color, #f8fafc);
    "
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
