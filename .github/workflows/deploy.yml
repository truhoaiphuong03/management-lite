name: Management Lite Semi-Auto CI/CD (Owner SHA Gate)

on:
  push:
    branches:
      - main
      - release/management-lite-web-test-clean
      - feat/windows-unified-baseline
  pull_request:
    branches:
      - main
      - release/management-lite-web-test-clean
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Target 40-char commit SHA to deploy (Mandatory)'
        required: true
        type: string
      owner_approved_sha:
        description: 'Owner confirmation: re-enter the exact 40-char commit SHA'
        required: true
        type: string
      allow_migration:
        description: 'Allow database migration during this deploy (Requires Owner migration approval)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force re-deploy even if same SHA is already live'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: management-lite-semi-auto-cicd-${{ github.event_name == 'workflow_dispatch' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Continuous Integration (Lint, Types, Build, Web & Backend Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global npm@10.9.2
          npm ci --no-audit --no-fund

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build API
        run: npm run build

      - name: Build Web
        run: npm run build:web

      - name: Run Security Tests
        run: npm run test:security

      - name: Run Web UI & RBAC Test Suites
        run: |
          node --test tests/web/issues-screen.test.mjs tests/web/schedule-screen.test.mjs tests/web/work-screen.test.mjs tests/web/staff-screen.test.mjs tests/web/attendance-screen.test.mjs tests/web/payroll-screen.test.mjs tests/web/reports-screen.test.mjs tests/web/rbac-visibility.test.mjs

      - name: Run Bug AI Management Unit Tests
        run: node --test tests/backend/bug-ai-management.test.mjs

  deploy:
    name: Windows Server Production Deploy (Owner SHA Approval Gate)
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    environment: production
    runs-on: [self-hosted, Windows, X64, management-lite-deploy]
    timeout-minutes: 15
    steps:
      - name: Validate Owner SHA Gate Inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = "${{ inputs.commit_sha }}".Trim().ToLowerInvariant()
          $approved = "${{ inputs.owner_approved_sha }}".Trim().ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{40}$') {
            throw "BLOCKED: commit_sha '$sha' must be a full 40-character hexadecimal Git SHA."
          }
          if ($sha -ne $approved) {
            throw "BLOCKED: owner_approved_sha ('$approved') does not match commit_sha ('$sha')."
          }
          Write-Host "PASS: Workflow dispatch SHA gate validated ($sha)."

      - name: Execute Hardened Semi-Auto Deployment with Atomic Rollback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = "${{ inputs.commit_sha }}".Trim().ToLowerInvariant()
          $approved = "${{ inputs.owner_approved_sha }}".Trim().ToLowerInvariant()
          $deployArgs = @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', 'C:\HoaiPhuong-Server\scripts\Deploy-SemiAutoWindows.ps1',
            '-CommitSha', $sha,
            '-OwnerApprovedSha', $approved
          )
          if ("${{ inputs.allow_migration }}" -ne "true") {
            $deployArgs += '-SkipMigration'
          }
          if ("${{ inputs.force }}" -eq "true") {
            $deployArgs += '-Force'
          }
          & powershell @deployArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Deployment failed with exit code $LASTEXITCODE"
          }

