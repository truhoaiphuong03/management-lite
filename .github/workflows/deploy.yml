name: Management Lite Semi-Auto CI/CD (Cryptographic Owner Gate)

on:
  push:
    branches:
      - main
      - release/management-lite-web-test-clean
      - feat/windows-unified-baseline
  pull_request:
    branches:
      - main
      - release/management-lite-web-test-clean
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Target 40-char commit SHA to deploy (Must match Ed25519-signed Owner approval)'
        required: true
        type: string
      artifact_sha256:
        description: '64-char SHA-256 of the CI-built release bundle approved by Owner'
        required: true
        type: string
      ci_run_id:
        description: 'Numeric CI Run ID that passed for this exact 40-char SHA'
        required: true
        type: string
      allow_migration:
        description: 'Allow database migration (Requires allow_migration=true in signed Owner manifest)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force re-deploy even if same SHA is already live'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: management-lite-semi-auto-cicd-${{ github.event_name == 'workflow_dispatch' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Continuous Integration & Release Bundle Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact immutable commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global npm@10.9.2
          npm ci --no-audit --no-fund

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build API
        run: npm run build

      - name: Build Web
        run: npm run build:web

      - name: Run Security & CI Policy Tests
        run: |
          npm run test:security
          node --test tests/backend/cicd-policy.test.mjs

      - name: Run Web UI & RBAC Test Suites
        run: |
          node --test tests/web/issues-screen.test.mjs tests/web/schedule-screen.test.mjs tests/web/work-screen.test.mjs tests/web/staff-screen.test.mjs tests/web/attendance-screen.test.mjs tests/web/payroll-screen.test.mjs tests/web/reports-screen.test.mjs tests/web/rbac-visibility.test.mjs

      - name: Run Bug AI Management Unit Tests
        run: node --test tests/backend/bug-ai-management.test.mjs

      - name: Package Immutable Release Bundle & Record SHA-256
        run: |
          node scripts/deployment/package-release-bundle.mjs --type=full --out=release-bundle

      - name: Upload Verified Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: management-lite-release-${{ inputs.commit_sha || github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Windows Server Production Deploy (Ed25519 Owner Approval Gate)
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    environment: production
    runs-on: [self-hosted, Windows, X64, management-lite-deploy]
    timeout-minutes: 15
    steps:
      - name: Download CI-Verified Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: management-lite-release-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}\ml-release-${{ github.run_id }}

      - name: Execute Hardened Semi-Auto Deployment with Ed25519 Signature & Checksum Verification
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = "${{ inputs.commit_sha }}".Trim().ToLowerInvariant()
          $artHash = "${{ inputs.artifact_sha256 }}".Trim().ToLowerInvariant()
          $ciRun = "${{ inputs.ci_run_id }}".Trim()
          $bundleDir = "${{ runner.temp }}\ml-release-${{ github.run_id }}"
          $bundleFile = Get-ChildItem -LiteralPath $bundleDir -Filter "management-lite-full-*.tar.gz" -File | Select-Object -First 1
          if (-not $bundleFile) {
            throw "BLOCKED: Verified release bundle .tar.gz not found in downloaded artifact."
          }
          $deployArgs = @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', 'C:\HoaiPhuong-Server\scripts\Deploy-SemiAutoWindows.ps1',
            '-CommitSha', $sha,
            '-ArtifactPath', $bundleFile.FullName,
            '-ArtifactSha256', $artHash,
            '-CiRunId', $ciRun
          )
          if ("${{ inputs.allow_migration }}" -ne "true") {
            $deployArgs += '-SkipMigration'
          }
          if ("${{ inputs.force }}" -eq "true") {
            $deployArgs += '-Force'
          }
          & powershell @deployArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Deployment failed with exit code $LASTEXITCODE"
          }
