name: Management Lite Auto Deploy

on:
  push:
    branches:
      - main
      - release/management-lite-web-test-clean
  pull_request:
    branches:
      - main
      - release/management-lite-web-test-clean
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to deploy (leave blank for latest)'
        required: false
        type: string
      force:
        description: 'Force re-deploy even if same SHA'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: management-lite-auto-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Continuous Integration (Lint, Types, Build, Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global npm@10.9.2
          npm ci --no-audit --no-fund

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build API
        run: npm run build

      - name: Build Web
        run: npm run build:web

      - name: Run Security Tests
        run: npm run test:security

      - name: Run Bug AI Management Unit Tests
        run: node --test tests/backend/bug-ai-management.test.mjs

  deploy:
    name: Windows Server Production Deploy & Automated Verification
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: [self-hosted, Windows, X64, management-lite-deploy]
    timeout-minutes: 15
    steps:
      - name: Prepare and Execute Windows Safe Deployment
        shell: cmd
        run: |
          set COMMIT_SHA=${{ inputs.commit_sha }}
          if "%COMMIT_SHA%"=="" set COMMIT_SHA=${{ github.sha }}
          set FORCE_FLAG=
          if "${{ inputs.force }}"=="true" set FORCE_FLAG=-Force
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Continue'; Write-Host '=== PRE-SYNCING REPOSITORIES UNDER C:\HoaiPhuong-Server ==='; Get-ChildItem -Path 'C:\HoaiPhuong-Server' -Filter '.git' -Recurse -Hidden -Directory | ForEach-Object { $repo = $_.Parent.FullName; Write-Host ('Fetching all objects for ' + $repo); git -C $repo fetch origin --all --tags; git -C $repo fetch origin release/management-lite-web-test-clean:refs/remotes/origin/release/management-lite-web-test-clean; git -C $repo fetch origin %COMMIT_SHA% }; Write-Host '=== SCRIPT INSPECTION ==='; Get-Content -Path 'C:\HoaiPhuong-Server\scripts\Deploy-ManagementLite.ps1' -TotalCount 100"
          powershell -NoProfile -ExecutionPolicy Bypass -File "C:\HoaiPhuong-Server\scripts\Deploy-ManagementLite.ps1" -CommitSha %COMMIT_SHA% %FORCE_FLAG%

      - name: Execute Post-Deploy Bug & Health Verification
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "C:\HoaiPhuong-Server\scripts\Verify-BugFix.ps1"
