name: Management Lite Release Artifact Builder (Option 1 - Hosted CI Only)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Target 40-char commit SHA to verify, build, and package into immutable release bundle'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: management-lite-release-artifact-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  windows-p0-security:
    name: Windows P0 Security Gate (PowerShell, NTFS ACL, DPAPI, GCM & UAC)
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Validate 40-Character Hex Commit SHA
        shell: pwsh
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch '^[0-9a-f]{40}$') {
            throw "commit_sha must be a 40-character lowercase hexadecimal Git SHA."
          }
      - name: Checkout Exact Immutable Commit SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Configure Git Identity for Sandbox Repo Fixtures
        shell: pwsh
        run: |
          git config --global user.name "Windows P0 Security CI"
          git config --global user.email "windows-p0-ci@isolated.example.test"
      - name: Run Cross-Platform Policy & Windows P0 Security Gate Suite
        shell: powershell
        run: |
          node --test tests/backend/cicd-policy.test.mjs tests/backend/windows-p0-gate.test.mjs
      - name: Run Controller Syntax & Isolated Deployment Simulation on Windows PowerShell
        shell: powershell
        run: ./scripts/deployment/Test-DeploymentSimulation.ps1

  ci-verify-and-package:
    name: Verify Exact SHA, Run Full CI & Package Immutable Bundle (Zero Self-Hosted Runner)
    needs: windows-p0-security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_test
          POSTGRES_DB: postgres
          # Disposable CI-only value, not a production secret.
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_DATABASE_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate 40-Character Hex Commit SHA
        run: |
          if [[ ! "${{ inputs.commit_sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: commit_sha must be a 40-character lowercase hexadecimal Git SHA."
            exit 1
          fi

      - name: Checkout Exact Immutable Commit SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Checked-Out HEAD Matches Requested SHA & Belongs to main
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "${{ inputs.commit_sha }}" ]; then
            echo "ERROR: Checked out SHA ($ACTUAL_SHA) does not match requested SHA (${{ inputs.commit_sha }})"
            exit 1
          fi
          git merge-base --is-ancestor "${{ inputs.commit_sha }}" origin/main

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Exact npm & Dependencies
        run: |
          npm install --global npm@10.9.2
          npm ci --no-audit --no-fund

      - name: Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build Backend API & Frontend Web
        run: |
          npm run build
          npm run build:web

      - name: Run Isolated Database Regression, Contract, Web & CI/CD Policy Tests
        run: |
          node scripts/deployment/ci-isolated-tests.mjs
          node --test tests/backend/cicd-policy.test.mjs tests/web/issues-screen.test.mjs tests/web/schedule-screen.test.mjs tests/web/work-screen.test.mjs tests/web/settings-screen.test.mjs

      - name: Run Controller Syntax & Isolated Deployment Simulation
        shell: pwsh
        run: ./scripts/deployment/Test-DeploymentSimulation.ps1

      - name: Package Immutable Release Bundle & Cryptographically Bound CI Run Receipt
        run: |
          node scripts/deployment/package-release-bundle.mjs --type=full --out=.artifacts/release
          node -e '
            const fs = require("node:fs");
            const sha = process.argv[1];
            const provPath = `.artifacts/release/management-lite-full-${sha}.tar.gz.provenance.json`;
            const prov = JSON.parse(fs.readFileSync(provPath, "utf8"));
            if (!/^[0-9a-f]{64}$/.test(prov.sha256) || !/^[0-9a-f]{64}$/.test(prov.schemaIdentity)) {
              throw new Error("Invalid provenance sha256 or schemaIdentity");
            }
            const receipt = {
              id: process.env.GH_RUN_ID,
              run_id: process.env.GH_RUN_ID,
              run_attempt: Number(process.env.GH_RUN_ATTEMPT || "1"),
              head_sha: sha,
              head_branch: "main",
              workflow_path: ".github/workflows/deploy.yml",
              artifact_sha256: prov.sha256,
              schema_sha256: prov.schemaIdentity,
              status: "completed",
              conclusion: "success",
              event: process.env.GH_EVENT_NAME,
              repository: process.env.GH_REPO,
              generated_at_utc: new Date().toISOString()
            };
            fs.writeFileSync(`.artifacts/release/ci-run-receipt-${sha}.json`, JSON.stringify(receipt, null, 2), "utf8");
          ' "${{ inputs.commit_sha }}"
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}

      - name: Upload Immutable Release Artifact & CI Receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: management-lite-release-${{ inputs.commit_sha }}
          path: |
            .artifacts/release/management-lite-full-${{ inputs.commit_sha }}.tar.gz
            .artifacts/release/management-lite-full-${{ inputs.commit_sha }}.tar.gz.sha256
            .artifacts/release/management-lite-full-${{ inputs.commit_sha }}.tar.gz.provenance.json
            .artifacts/release/ci-run-receipt-${{ inputs.commit_sha }}.json
          retention-days: 30
          if-no-files-found: error
